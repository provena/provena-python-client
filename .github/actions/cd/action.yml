#  Ensure token permissions include write e.g.
#  permissions:
#    id-token: write
#    contents: write
# Ensure the github token is passed through and that fetch-depth = 0 (to get historical commits)
name: cd
description: CD steps including pypi deployment and semantic versioning
inputs:
  github_token:
    description: "GitHub Token"
    required: true
outputs:
  released:
    description: "Whether python-semantic-release created a release"
    value: ${{ steps.release.outputs.released }}
runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"

    - name: Install poetry
      uses: snok/install-poetry@v1
      with:
        version: "2.4.1"

    - name: Install package
      shell: bash
      run: poetry install

    - name: Build documentation
      shell: bash
      run: poetry run make html --directory docs/

    - name: Publish Documentation
      env:
        github_token: ${{inputs.github_token}}
      shell: bash
      run: poetry run ghp-import -n -p -f -o docs/_build/html

    - name: Use Python Semantic Release to prepare release
      id: release
      uses: python-semantic-release/python-semantic-release@v9.12.0
      with:
        github_token: ${{ inputs.github_token }}
